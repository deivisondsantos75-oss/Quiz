<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gênio Quiz de Front-End - Perguntas</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <header>
        <h1>Gênio Quiz de Front-End</h1>
    </header>

    <main>
        <section class="quiz-card" id="quiz-card">
            <div class="question-meta">
                <span class="question-eyebrow" id="question-eyebrow">Pergunta</span>
                <span class="question-stats" id="question-stats">Acertos: 0 · Erros: 0/5</span>
            </div>
            <p class="question-text" id="question-text"></p>

            <div class="options-list" id="options-list">
                <!-- Opções inseridas dinamicamente pelo quiz.js -->
            </div>

            <p class="feedback" id="feedback"></p>

            <button class="next-btn" id="next-btn" disabled>Próxima</button>
        </section>

        <section class="results-card" id="results-card" hidden>
            <span class="question-eyebrow">Resultado</span>
            <p class="results-score" id="results-score"></p>
            <p class="results-message" id="results-message"></p>
            <button id="restart-btn">Refazer o quiz</button>
        </section>
    </main>

    <footer>
        <p class="footer-description">
            Esse quiz foi feito por Deivison Dos Santos, Rafael Tamy, Cauã Eduardo e Davi Ribeiro,
            para testar seu conhecimento sobre front-end (HTML, JS, CSS).
        </p>
        <p class="footer-rights">© 2026 · Todos os direitos reservados · 19/08/2026</p>
    </footer>

    <script src="quiz.js"></script>
</body>
</html>
