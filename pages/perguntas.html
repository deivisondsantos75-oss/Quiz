<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Gênio Quiz dos Supremos - Perguntas</title>
    <link rel="stylesheet" href="../css/main.css">
</head>
<body>
    <main>
        <div class="screen quiz-screen">
            <div class="scanlines"></div>

            <div class="screen-content quiz-screen-content">
                <section class="quiz-card" id="quiz-card">
                    <div class="question-meta">
                        <span class="question-eyebrow" id="question-eyebrow">Pergunta</span>
                        <span class="question-stats" id="question-stats">Acertos: 0 · Erros: 0/5</span>
                    </div>
                    <p class="question-text" id="question-text"></p>

                    <div class="options-list" id="options-list">

                    </div>

                    <p class="feedback" id="feedback"></p>

                    <p class="explanation" id="explanation" hidden></p>

                    <button class="next-btn" id="next-btn" disabled>Próxima</button>
                </section>

                <section class="results-card" id="results-card" hidden>
                    <span class="question-eyebrow">Resultado</span>
                    <p class="results-score" id="results-score"></p>
                    <p class="results-message" id="results-message"></p>
                    <button id="restart-btn">Refazer o quiz</button>
                </section>
            </div>
        </div>
    </main>

    <site-footer></site-footer>

    <script src="../js/components.js"></script>
    <script src="../js/quiz.js"></script>
</body>
</html>
